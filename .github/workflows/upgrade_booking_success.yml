name: Upgrade booking success celebration

on:
  push:
    branches:
      - agent/frictionless-test-booking
    paths:
      - .github/workflows/upgrade_booking_success.yml

permissions:
  contents: write

jobs:
  upgrade-success-state:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/frictionless-test-booking
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Replace the plain success dialog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/frictionless_test_booking_screen.dart')
          text = path.read_text(encoding='utf-8')

          if "import 'dart:math' as math;" not in text:
              text = text.replace(
                  "import 'dart:async';\n",
                  "import 'dart:async';\nimport 'dart:math' as math;\n",
                  1,
              )

          if "import 'package:flutter/services.dart';" not in text:
              text = text.replace(
                  "import 'package:flutter/material.dart';\n",
                  "import 'package:flutter/material.dart';\nimport 'package:flutter/services.dart';\n",
                  1,
              )

          start_marker = "      await showDialog<void>(\n"
          end_marker = "\n\n      if (!mounted) return;\n      Navigator.of(context).pop(true);"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate the existing booking success dialog.')

          replacement = """      await HapticFeedback.mediumImpact();
          if (!mounted) return;

          await showGeneralDialog<void>(
            context: context,
            barrierDismissible: false,
            barrierLabel: 'Booking request sent',
            barrierColor: const Color(0xB30F172A),
            transitionDuration: const Duration(milliseconds: 280),
            pageBuilder: (dialogContext, _, __) => _BookingSuccessCelebration(
              requiresLabVisit: _requiresLabVisit,
              testCount: widget.tests.length,
              total: _total,
              onViewBooking: () => Navigator.of(dialogContext).pop(),
            ),
            transitionBuilder: (context, animation, _, child) {
              final curved = CurvedAnimation(
                parent: animation,
                curve: Curves.easeOutCubic,
                reverseCurve: Curves.easeInCubic,
              );
              return FadeTransition(
                opacity: curved,
                child: ScaleTransition(
                  scale: Tween<double>(begin: .96, end: 1).animate(curved),
                  child: child,
                ),
              );
            },
          );"""

          text = text[:start] + replacement + text[end:]

          widget_marker = "\nclass _SearchField extends StatelessWidget {"
          if widget_marker not in text:
              raise SystemExit('Could not locate the success-widget insertion point.')

          celebration_widget = r'''

