name: Apply booking success celebration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/upgrade_booking_success.yml
      - .github/workflows/apply_booking_success_on_pr.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Apply the prepared source transformation
        shell: bash
        run: |
          python3 - <<'EXTRACT'
          from pathlib import Path

          workflow = Path(
              '.github/workflows/upgrade_booking_success.yml'
          ).read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          encoded_script = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in encoded_script.splitlines()
          )
          exec(compile(script, 'booking_success_upgrade.py', 'exec'))

          target = Path('lib/screens/frictionless_test_booking_screen.dart')
          generated = target.read_text(encoding='utf-8')
          generated = generated.replace(
              '.clamp(0.0, 1.0)',
              '.clamp(0.0, 1.0).toDouble()',
          )
          target.write_text(generated, encoding='utf-8')
          EXTRACT

      - name: Format the updated Dart file
        run: dart format lib/screens/frictionless_test_booking_screen.dart

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze the updated screen
        run: flutter analyze lib/screens/frictionless_test_booking_screen.dart

      - name: Commit the validated upgrade
        shell: bash
        run: |
          rm .github/workflows/upgrade_booking_success.yml
          rm .github/workflows/apply_booking_success_on_pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/frictionless_test_booking_screen.dart .github/workflows
          git commit -m "animate booking success reward"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
