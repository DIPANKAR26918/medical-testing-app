name: Finalize booking success celebration

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/finalize_booking_success.yml

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Fix final lint and remove diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/frictionless_test_booking_screen.dart')
          text = path.read_text(encoding='utf-8')
          old = 'pageBuilder: (dialogContext, _, __) =>'
          new = 'pageBuilder: (dialogContext, _, _) =>'
          if old not in text:
              raise SystemExit('Expected pageBuilder signature was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('booking_success_analyze.txt').unlink(missing_ok=True)
          PY

      - name: Format and analyze
        shell: bash
        run: |
          dart format lib/screens/frictionless_test_booking_screen.dart
          flutter pub get
          flutter analyze lib/screens/frictionless_test_booking_screen.dart

      - name: Commit validated final source
        shell: bash
        run: |
          rm .github/workflows/finalize_booking_success.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "finalize booking success celebration"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
